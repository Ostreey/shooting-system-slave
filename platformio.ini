; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; CI runs a bare `pio run` and then copies .pio/build/<env>/firmware.bin for exactly these
; two environments. Any extra environment listed here breaks the release build.
default_envs = esp32, esp32-s3

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -DCONFIG_GPIO_ESP32_SUPPORT_SWITCH_SLP_PULL=1
    -DBOARD_ESP32
; The tests are host tests. Ignored here so a bare `pio test` cannot end in an upload to whatever
; target happens to be plugged in.
test_ignore = *

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -DCONFIG_GPIO_ESP32_SUPPORT_SWITCH_SLP_PULL=1
    -DCONFIG_BT_BLE_ENABLED=1
    -DCONFIG_BT_BLE_42_FEATURES_SUPPORTED=1
    -DCONFIG_BT_BLE_50_FEATURES_SUPPORTED=1
    -DCONFIG_BT_BLE_EXT_ADV_ENABLED=1
    -DBOARD_ESP32S3
; Host tests only - see env:esp32.
test_ignore = *

; Host tests for the hardware-free part of the flat-cell guard: the start decision table and the
; battery level reported over BLE. Needs a host compiler, which the development machine does not
; have. NOT RUN ANYWHERE TODAY: the CI workflow only does `pio run`, there is no `pio test` step,
; so a change to the discharge LUT or ADC_BATTERY_OFFSET_MV is not caught by these tests until
; someone adds that step (ubuntu-latest ships g++) or runs them by hand. Kept out of default_envs: CI
; runs a bare `pio run` and copies .pio/build/<env>/firmware.bin for exactly the two boards, so an
; extra environment there would break the release step.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<BatteryGuard.cpp> +<BatteryScale.cpp>
build_flags =
    -std=gnu++11
    -Isrc

; Test target for migration sessions on a board with NO cell attached. Disables the two voltage
; triggers and the idle auto-sleep, keeps the charger trigger and the BLE sleep command, and
; never writes the flat-cell latch to NVS (pio run -t upload does not erase NVS, so a latch left
; behind by a debugging session would survive a reflash and look like a target refusing to boot).
; MIGRATION_TEST_OPT_IN is the token include/BuildGuards.h demands; without it the flag is a hard
; compile error, so it cannot slip into a release build. FIRMWARE_VERSION reads 1.0.9nobatt-esp32s3,
; so the app shows what is really on the target. The nobatt marker belongs in the version member,
; before the board dash: the released app reads the board with substringAfter("-") and matches it
; against a list of exactly "esp32"/"esp32s3" (FirmwareRepositoryImpl.extractBoardFromVersion), so
; a marker moved to the end would miss the list, fall back to "esp32" and have the app quietly
; download the firmware for the wrong board. Kept out of default_envs, so CI never sees it.
; NEVER flash this on a target with a cell in it.
[env:migration-test]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -DMIGRATION_TEST_NO_BATTERY=1
    -DMIGRATION_TEST_OPT_IN=1
